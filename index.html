<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="max-w-2xl mx-auto space-y-6">
        <h1 class="text-2xl font-bold text-slate-900">Time Tracker</h1>

        <!-- Forma za dodavanje novog zadatka -->
        <form id="task-form" class="bg-white border border-slate-200 rounded-xl p-4 flex flex-col sm:flex-row gap-3">
            <input id="task-input" type="text" required placeholder="Unesi naziv zadatka (npr. Učenje JavaScript-a)..."
                class="flex-1 px-3.5 py-2 rounded-lg border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
            <button type="submit"
                class="px-5 py-2 rounded-lg bg-teal-600 hover:bg-teal-700 text-white text-sm font-semibold cursor-pointer">
                + Dodaj zadatak
            </button>
        </form>

        <!-- Ovde će JavaScript iscrtati zadatke -->
        <div id="tasks-container" class="space-y-3"></div>
    </div>

    <script type="module" src="js/app.js"></script>
</body>

</html>
