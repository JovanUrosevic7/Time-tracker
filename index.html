<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Time tracker</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
</head>

<body>
    <div class="max-w-4xl mx-auto px-4 py-8 space-y-6">
        <!-- Zaglavlje i navigacija -->
        <header
            class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Time Tracker</h1>
                <p class="text-sm text-slate-500">
                    Pratite vreme provedeno na zadacima i projektima
                </p>
            </div>

            <nav class="flex items-center gap-2">
                <a href="index.html" class="px-4 py-2 rounded-xl text-sm font-semibold bg-teal-600 text-white">
                    Zadaci
                </a>
                <a href="reports.html"
                    class="px-4 py-2 rounded-xl text-sm font-semibold bg-slate-100 text-slate-700 hover:bg-slate-200 transition-colors">
                    Izveštaji
                </a>
            </nav>
        </header>

        <!-- Kratak pregled (puni js/app.js) -->
        <section class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">
                    Ukupno zadataka
                </p>
                <p id="total-tasks-count" class="text-2xl font-bold text-slate-900 mt-1">
                    0
                </p>
            </div>

            <div class="bg-white border border-slate-200 rounded-2xl p-4 shadow-sm">
                <p class="text-xs uppercase tracking-wider text-slate-400 font-semibold">
                    Ukupno zabeleženo vreme
                </p>
                <p id="total-time-display" class="text-2xl font-mono font-bold text-teal-600 mt-1">
                    00:00:00
                </p>
            </div>
        </section>

        <!-- Forma za pravljenje novog zadatka -->
        <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm">
            <h2 class="text-lg font-bold text-slate-900 mb-4">Novi zadatak</h2>

            <form id="task-form" class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <div class="sm:col-span-1">
                    <label for="task-title" class="block text-xs font-medium text-slate-600 mb-1">
                        Naziv zadatka *
                    </label>
                    <input id="task-title" type="text" required placeholder="npr. Izrada početne strane"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
                </div>

                <div class="sm:col-span-1">
                    <label for="task-project" class="block text-xs font-medium text-slate-600 mb-1">
                        Projekat / kategorija
                    </label>
                    <input id="task-project" type="text" placeholder="npr. Sajt klijenta"
                        class="w-full px-3.5 py-2.5 rounded-xl border border-slate-300 text-sm focus:outline-none focus:ring-2 focus:ring-teal-500" />
                </div>

                <div class="sm:col-span-1 flex items-end">
                    <button type="submit"
                        class="w-full py-2.5 px-4 rounded-xl bg-teal-600 hover:bg-teal-700 text-white font-semibold text-sm transition-colors cursor-pointer">
                        + Dodaj zadatak
                    </button>
                </div>
            </form>
        </section>

        <!-- Lista zadataka -->
        <section class="bg-white border border-slate-200 rounded-2xl p-5 shadow-sm space-y-4">
            <div class="flex items-center justify-between">
                <h2 class="text-lg font-bold text-slate-900">Lista zadataka</h2>
                <span class="text-xs text-slate-400">Klikni Start za merenje vremena</span>
            </div>

            <div id="tasks-list" class="space-y-3">
                <!-- Kartice zadataka ubacuje js/app.js -->
            </div>
        </section>
    </div>


    <script type="module" src="js/storage.js"></script>
</body>

</html>
